name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/foreign-language-conversation-app-ww3asg]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the triggering commit)
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy run in separate jobs: since ~2026-11-21 deploy-pages often can't see an
  # artifact uploaded earlier in the same job ("No artifacts named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Validate content JSON
        run: |
          for f in content/index.json content/*/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons content _site/
          [ -d audio ] && cp -r audio _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # artifact listing can lag; retry once (never re-upload: that causes "multiple artifacts")
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
