name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/foreign-language-conversation-app-ww3asg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate content JSON
        run: |
          for f in content/index.json content/*/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html styles.css app.js sw.js manifest.webmanifest icons content _site/
          [ -d audio ] && cp -r audio _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
